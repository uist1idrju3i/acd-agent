name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "変更範囲判定の基準commit（空なら全範囲を実行）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
      core: ${{ steps.scope.outputs.core }}
      gates_inputs: ${{ steps.scope.outputs.gates_inputs }}
      main: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      plugins: ${{ steps.scope.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Classify changed scope
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changed_scope.py

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint_archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$actionlint_archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" \
            | sha256sum --check
          tar xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Fast or standard verification
        env:
          CORE_CHANGED: ${{ needs.changes.outputs.core }}
        run: |
          if [ "$CORE_CHANGED" = "true" ]; then
            uv run python scripts/verify_all.py --stage standard
          else
            uv run python scripts/verify_all.py --stage fast
          fi
      - name: Whitespace check
        run: git diff --check

  skills:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.main == 'true' || needs.changes.outputs.plugins == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The PPA metadata refresh plus the library downloads dominate this job's
      # setup. The .deb files are cached; the version gate below still runs on
      # every install so a stale cache cannot silently pin a non-10.0 release.
      - name: Restore KiCad library packages
        id: kicad_debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kicad-debs
          key: kicad-libs-debs-${{ runner.os }}-10.0-v1
      - name: Download KiCad libraries
        if: steps.kicad_debs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kicad-debs/partial"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y --download-only \
            -o "Dir::Cache::archives=$RUNNER_TEMP/kicad-debs" \
            kicad-footprints kicad-symbols
          sudo rm -rf "$RUNNER_TEMP/kicad-debs/partial" "$RUNNER_TEMP/kicad-debs/lock"
      - name: Install KiCad libraries
        run: |
          set -euo pipefail
          sudo dpkg -i "$RUNNER_TEMP"/kicad-debs/*.deb
          for package in kicad-footprints kicad-symbols; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            printf '%s=%s\n' "$package" "$version"
            printf '%s\n' "$version" | grep -E '^10\.0\.'
          done
      - name: Sync workspace
        run: uv sync
      # Skill and hook tests are separate from the core gates: their result never
      # decides an ACD design gate.
      - name: Skill and hook tests (pytest plugins)
        run: uv run pytest plugins -q

  # pinned-acd-probe runs only on main; on pull requests the job is skipped at
  # job level, which GitHub treats as a passing required check without
  # allocating a runner. container-gates also runs on pull requests that touch
  # fixtures/, profiles/, or the image digest lock so that recorded-input
  # regressions surface before merge (AA-1).
  pinned-acd-probe:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Probe pinned ACD against GD1
        run: uv run --script scripts/probe_pinned_acd_graph.py --fixture fixtures/golden-design-1

  container-gates:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.main == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.gates_inputs == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Start locked image warm pull
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))
          entry = lock.get("acd_server")
          if not isinstance(entry, dict):
              raise SystemExit("acd_server lock entry is malformed")
          image = entry.get("image")
          digest = entry.get("digest")
          if not isinstance(image, str) or not isinstance(digest, str):
              raise SystemExit("acd_server image lock is malformed")
          image_ref = f"{image}@{digest}"
          if re.fullmatch(r"[^@\s]+@sha256:[0-9a-f]{64}", image_ref) is None:
              raise SystemExit("acd_server image ref must be digest-pinned")
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          log_path = runner_temp / "acd-server-warm-pull.log"
          pid_path = runner_temp / "acd-server-warm-pull.pid"
          with log_path.open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  ["docker", "pull", image_ref],
                  stdout=log,
                  stderr=subprocess.STDOUT,
              )
          pid_path.write_text(str(process.pid), encoding="utf-8")
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Restore ACD workspace caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/acd-cache
          key: acd-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            acd-cache-${{ runner.os }}-
      - name: Prepare workspace runner
        run: uv sync
      - name: Resolve locked agent-server image
        run: |
          SERVER_REF=$(uv run python scripts/print_locked_image.py --entry acd-server)
          printf 'SERVER_REF=%s\n' "$SERVER_REF" >> "$GITHUB_ENV"
      - name: Wait for warm pull
        run: |
          set -euo pipefail
          pid_file="$RUNNER_TEMP/acd-server-warm-pull.pid"
          if [ ! -s "$pid_file" ]; then
            exit 0
          fi
          pid=$(cat "$pid_file")
          # Warm-pull failure is ignored; the authoritative pull and digest verification remain below.
          while kill -0 "$pid" 2>/dev/null; do
            sleep 1
          done
      - name: Pull locked agent-server image
        run: |
          uv run python scripts/pull_locked_image.py \
            --entry acd-server \
            --record out/container/pull-acd-server.json
      - name: Verify registry image digest lock
        run: uv run python scripts/verify_image_digest_lock.py
      - name: Run deterministic gates in DockerWorkspace
        run: |
          uv run python scripts/run_in_workspace.py \
            --image "$SERVER_REF" \
            --repo "$GITHUB_WORKSPACE" \
            --cache-dir "${{ runner.temp }}/acd-cache" \
            --host-resource-report out/host-resources.json \
            --download out/gd1/evidence-electrical.json \
            --download out/gd1-enclosure/evidence-mechanical.json \
            --download out/gd1-fw/evidence-firmware.json \
            --download out/manufacturing-submission.json \
            'uv sync && uv run python scripts/run_design_lanes.py && uv run python scripts/verify_manufacturing_submission.py --board-out out/gd1 --enclosure-out out/gd1-enclosure --graph fixtures/golden-design-1/graph.json --require-authoritative --out out/manufacturing-submission.json'
          uv run python scripts/verify_authoritative_evidence.py \
            --revision-from fixtures/golden-design-1/graph.json \
            --out-root out/container/gd1 \
            --out-root out/container/gd1-enclosure \
            --out-root out/container/gd1-fw \
            --require-lane electrical --require-lane mechanical --require-lane firmware
          uv run python scripts/verify_manufacturing_submission.py \
            --verdict out/container/manufacturing-submission.json \
            --graph fixtures/golden-design-1/graph.json \
            --require-authoritative
      - name: Run non-GD1 deterministic gates in DockerWorkspace
        run: |
          uv run python scripts/run_in_workspace.py \
            --image "$SERVER_REF" \
            --repo "$GITHUB_WORKSPACE" \
            --cache-dir "${{ runner.temp }}/acd-cache" \
            --download out/mbd-fixture/graph.json \
            --download-root out/mbd \
            'uv sync && uv run python scripts/build_design_fixture.py --spec fixtures/mini-blink-dongle/spec.json --out out/mbd-fixture && uv run python scripts/run_design_lanes.py --fixture out/mbd-fixture --out-root out/mbd && uv run python scripts/verify_manufacturing_submission.py --board-out out/mbd/mini-blink-dongle --enclosure-out out/mbd/mini-blink-dongle-enclosure --graph out/mbd-fixture/graph.json --require-authoritative --out out/mbd/manufacturing-submission.json'
          uv run python scripts/verify_authoritative_evidence.py \
            --revision-from out/container/mbd-fixture/graph.json \
            --out-root out/container/mbd \
            --require-lane electrical --require-lane mechanical --require-lane firmware
          uv run python scripts/verify_manufacturing_submission.py \
            --verdict out/container/mbd/manufacturing-submission.json \
            --graph out/container/mbd-fixture/graph.json \
            --require-authoritative
      - name: Report host resource preflight
        if: always()
        run: |
          if [ -f out/host-resources.json ]; then
            cat out/host-resources.json
          else
            echo "host resource report was not produced"
          fi

  docs-verify:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Documentation verification
        run: |
          uv run python scripts/verify_all.py --stage docs
          git diff --check
