name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type check (pyright)
        run: uv run pyright
      - name: Tests (pytest)
        run: uv run pytest
      - name: Verify docs
        run: uv run python scripts/verify_docs.py
      - name: Golden mechanical task
        run: uv run python scripts/run_gd1_enclosure_pipeline.py --out out/gd1-enclosure
      - name: Probe external tools (informational)
        run: uv run python scripts/probe_tools.py
      - name: Whitespace check
        run: git diff --check

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      # Skill and hook tests are separate from the core gates: their result never
      # decides an ACD design gate.
      - name: Skill and hook tests (pytest plugins)
        run: uv run pytest plugins -q
