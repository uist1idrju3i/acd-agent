name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Standard verification
        run: uv run python scripts/verify_all.py --stage standard
      - name: Golden mechanical task
        run: uv run python scripts/run_gd1_enclosure_pipeline.py --out out/gd1-enclosure
      - name: Probe external tools (informational)
        run: uv run python scripts/probe_tools.py
      - name: Whitespace check
        run: git diff --check

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      # Skill and hook tests are separate from the core gates: their result never
      # decides an ACD design gate.
      - name: Skill and hook tests (pytest plugins)
        run: uv run pytest plugins -q

  container-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Prepare workspace runner
        run: uv sync
      - name: Resolve locked agent-server image
        run: |
          SERVER_REF=$(uv run python scripts/print_locked_image.py --entry acd-server)
          printf 'SERVER_REF=%s\n' "$SERVER_REF" >> "$GITHUB_ENV"
      - name: Pull locked agent-server image
        run: docker pull "$SERVER_REF"
      - name: Run deterministic gates in DockerWorkspace
        run: |
          uv run python scripts/run_in_workspace.py \
            --image "$SERVER_REF" \
            --repo "$GITHUB_WORKSPACE" \
            'uv sync && uv run python scripts/resolve_gd1_silkscreen.py && uv run python scripts/run_gd1_pipeline.py --out out/gd1 && uv run python scripts/run_gd1_enclosure_pipeline.py --out out/gd1-enclosure && uv run pytest -q tests/core/test_design_predicates.py::test_gd1_predicates_pass_on_fixture tests/core/test_design_predicates.py::test_power_decoupling_distant_capacitor_fails tests/pipeline/test_gd1_silkscreen_pinning.py::test_final_silkscreen_coordinates_are_pinned tests/pipeline/test_gd1_negative_fixtures.py'
          uv run python scripts/verify_authoritative_evidence.py \
            --revision-from fixtures/golden-design-1/graph.json \
            out/gd1/evidence-electrical.json \
            out/gd1-enclosure/evidence-mechanical.json
