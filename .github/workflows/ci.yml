name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type check (pyright)
        run: uv run pyright
      - name: Tests (pytest)
        run: uv run pytest
      - name: Verify docs
        run: uv run python scripts/verify_docs.py
      - name: Golden mechanical task
        run: uv run python scripts/run_gd1_enclosure_pipeline.py --out out/gd1-enclosure
      - name: Probe external tools (informational)
        run: uv run python scripts/probe_tools.py
      - name: Whitespace check
        run: git diff --check
