name: Publish ACD tools image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "plugins/acd/skills/**"
      - "scripts/probe_pinned_acd_graph.py"
      - "!docker/image-digests.json"
      - "!docker/README.md"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: docker/acd-tools.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/acd-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: |
          {
            echo "## ACD tools image"
            echo
            echo "\`${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
