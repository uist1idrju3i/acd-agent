name: Publish ACD images

on:
  workflow_dispatch:
    inputs:
      skip_tools:
        description: "tools image を再buildせずlock済みtools imageをbaseにserverだけを再buildする"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "plugins/acd/skills/**"
      - "scripts/probe_pinned_acd_graph.py"
      - "!docker/image-digests.json"
      - "!docker/README.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Sync workspace
        run: uv sync
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tools image
        id: tools_publish
        if: inputs.skip_tools != true
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: docker/acd-tools.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/acd-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve tools image
        env:
          BUILT_DIGEST: ${{ steps.tools_publish.outputs.digest }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          set -euo pipefail
          if [ "${SKIP_TOOLS:-false}" = true ]; then
            TOOLS_REF=$(uv run python scripts/print_locked_image.py --entry acd-tools)
            uv run python scripts/pull_locked_image.py \
              --entry acd-tools \
              --record out/container/pull-acd-tools.json
          else
            case "$BUILT_DIGEST" in
              sha256:*) ;;
              *)
                echo "unresolved acd-tools digest: $BUILT_DIGEST" >&2
                exit 1
                ;;
            esac
            TOOLS_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-tools@${BUILT_DIGEST}"
          fi
          printf 'TOOLS_REF=%s\n' "$TOOLS_REF" >> "$GITHUB_ENV"
          printf 'TOOLS_DIGEST=%s\n' "${TOOLS_REF##*@}" >> "$GITHUB_ENV"
      - name: Measure published tools image
        if: inputs.skip_tools != true
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          uv run python scripts/measure_image_tools.py \
            --image-ref "$TOOLS_REF" \
            --out "$RUNNER_TEMP/acd-tools-tools.json"
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SERVER_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and publish server image
        env:
          CUSTOM_TAGS: latest
          # SDK_SHA must identify the checked out source, not the workflow file.
          SDK_SHA: ${{ env.SERVER_SHA }}
        run: |
          set -euo pipefail
          uv run python vendor/software-agent-sdk/openhands-agent-server/openhands/agent_server/docker/build.py \
            --base-image "$TOOLS_REF" \
            --image ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server \
            --target source \
            --platforms linux/amd64 \
            --push \
            --sdk-project-root "$GITHUB_WORKSPACE/vendor/software-agent-sdk"
      - name: Publish latest server alias
        env:
          SERVER_SHA: ${{ env.SERVER_SHA }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server:latest \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server:${SERVER_SHA}-latest-source"
      - name: Resolve published server digest
        env:
          SERVER_SHA: ${{ env.SERVER_SHA }}
        run: |
          set -euo pipefail
          SERVER_TAG="${SERVER_SHA}-latest-source"
          SERVER_DIGEST=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server:$SERVER_TAG" | tr -d '"')
          case "$SERVER_DIGEST" in
            sha256:*) ;;
            *)
              echo "unresolved acd-server digest: $SERVER_DIGEST" >&2
              exit 1
              ;;
          esac
          printf 'SERVER_TAG=%s\n' "$SERVER_TAG" >> "$GITHUB_ENV"
          printf 'SERVER_DIGEST=%s\n' "$SERVER_DIGEST" >> "$GITHUB_ENV"
      - name: Measure published server image
        run: |
          set -euo pipefail
          uv run python scripts/measure_image_tools.py \
            --image-ref "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server@${SERVER_DIGEST}" \
            --out "$RUNNER_TEMP/acd-server-tools.json"
      - name: Record published image summary
        env:
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          {
            echo "## ACD images"
            echo
            if [ "${SKIP_TOOLS:-false}" = true ]; then
              echo "- **tools**: existing locked image (not rebuilt)"
            else
              echo "- **tools**: \`$TOOLS_REF\`"
            fi
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **server**: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server@${SERVER_DIGEST}\`"
            echo "- **server tag**: \`$SERVER_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open digest lock update PR
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          set -euo pipefail
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${SKIP_TOOLS:-false}" != true ]; then
            uv run python scripts/update_image_digest_lock.py \
              --lock docker/image-digests.json \
              --entry acd_tools \
              --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-tools" \
              --tag latest \
              --digest "$TOOLS_DIGEST" \
              --published-at "$published_at" \
              --workflow-run "$workflow_run" \
              --tools-json "$RUNNER_TEMP/acd-tools-tools.json"
          fi
          uv run python scripts/update_image_digest_lock.py \
            --lock docker/image-digests.json \
            --entry acd_server \
            --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server" \
            --tag "$SERVER_TAG" \
            --digest "$SERVER_DIGEST" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/acd-server-tools.json"
          if git diff --quiet -- docker/image-digests.json; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          branch="bot/update-image-digests-${SERVER_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json
          git commit -m "ACD image digest lockを更新"
          git push --set-upstream origin "$branch"
          if [ "${SKIP_TOOLS:-false}" = true ]; then
            tools_line="tools: locked image (not rebuilt)"
          else
            tools_line="tools: ${TOOLS_REF}"
          fi
          body=$(printf '%s\n' \
            "Publish workflowでACD image digest lockを更新しました。" \
            "" \
            "$tools_line" \
            "server: ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server@${SERVER_DIGEST}" \
            "workflow run: ${workflow_run}")
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "ACD image digest lockを更新" \
            --body "$body"
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash --auto "$branch" \
            || echo "auto-merge unavailable; merge the lock PR manually" >> "$GITHUB_STEP_SUMMARY"
