name: Update Skill package ref

on:
  push:
    branches: [main]
    paths:
      - "src/acd/**"
      - "fixtures/**"
      - "plugins/acd/skills/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skill-package-ref
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Detect package skew
        id: check
        shell: bash
        run: |
          set +e
          uv run python scripts/verify_skill_package_ref.py --check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "skew=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skew=true" >> "$GITHUB_OUTPUT"
      - name: Update package ref
        if: steps.check.outputs.skew == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-skill-package-ref-${GITHUB_SHA::12}"
          git switch -c "$branch"
          uv run python scripts/update_skill_package_ref.py --ref "$GITHUB_SHA"
          uv run python scripts/verify_skill_package_ref.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/acd/skills/acd-package-ref.txt \
            plugins/acd/skills/acd-package-contract.json \
            plugins/acd/skills/*/scripts/*.py \
            scripts/probe_pinned_acd_graph.py
          git commit -m "Skill package refをmerge commitへ更新"
          git push --set-upstream origin "$branch"
          body_file="${RUNNER_TEMP}/skill-package-ref-pr-body.md"
          cat > "$body_file" <<'EOF'
          ## 概要

          merge commitの`acd`実装へSkill package refを再固定しました。
          EOF
          gh pr create \
            --title "Skill package refをmerge commitへ更新" \
            --body-file "$body_file"
