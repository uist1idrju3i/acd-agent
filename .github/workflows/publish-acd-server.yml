name: Publish ACD agent-server image

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ACD tools image
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          submodules: true
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Sync workspace
        run: uv sync
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve base tools image
        env:
          UPSTREAM_PUBLISH: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$UPSTREAM_PUBLISH" = true ]; then
            digest=$(docker buildx imagetools inspect \
              --format '{{json .Manifest.Digest}}' \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-tools:latest" | tr -d '"')
            case "$digest" in
              sha256:*) ;;
              *)
                echo "unresolved acd-tools digest: $digest" >&2
                exit 1
                ;;
            esac
            TOOLS_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-tools@${digest}"
          else
            TOOLS_REF=$(uv run python scripts/print_locked_image.py --entry acd-tools)
            uv run python scripts/pull_locked_image.py \
              --entry acd-tools \
              --record out/container/pull-acd-tools.json
          fi
          printf 'TOOLS_REF=%s\n' "$TOOLS_REF" >> "$GITHUB_ENV"
      - name: Resolve source commit
        run: |
          set -euo pipefail
          printf 'SERVER_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          CUSTOM_TAGS: latest
          # build.py derives image tags from SDK_SHA/GITHUB_SHA. On workflow_run
          # events GITHUB_SHA is the workflow file's commit, not the checked out
          # source, so the published tags would not match the built source.
          SDK_SHA: ${{ env.SERVER_SHA }}
        run: |
          uv run python vendor/software-agent-sdk/openhands-agent-server/openhands/agent_server/docker/build.py \
            --base-image "$TOOLS_REF" \
            --image ghcr.io/uist1idrju3i/acd-server \
            --target source \
            --platforms linux/amd64 \
            --push \
            --sdk-project-root "$GITHUB_WORKSPACE/vendor/software-agent-sdk"
      - name: Publish latest alias
        env:
          SERVER_SHA: ${{ env.SERVER_SHA }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/uist1idrju3i/acd-server:latest \
            "ghcr.io/uist1idrju3i/acd-server:${SERVER_SHA}-latest-source"
      - name: Resolve published server tag
        env:
          SERVER_SHA: ${{ env.SERVER_SHA }}
        run: |
          set -euo pipefail
          printf 'SERVER_TAG=%s-latest-source\n' "$SERVER_SHA" >> "$GITHUB_ENV"
      - name: Record base and derived digests
        env:
          SERVER_TAG: ${{ env.SERVER_TAG }}
        run: |
          DERIVED_DIGEST=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "ghcr.io/uist1idrju3i/acd-server:$SERVER_TAG" | tr -d '"')
          {
            echo "## ACD agent-server image"
            echo
            echo "- **base**: \`$TOOLS_REF\`"
            echo "- **derived**: \`ghcr.io/uist1idrju3i/acd-server:$SERVER_TAG@$DERIVED_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure published image tools
        env:
          SERVER_TAG: ${{ env.SERVER_TAG }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server:$SERVER_TAG" | tr -d '"')
          uv run python scripts/measure_image_tools.py \
            --image-ref "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server@${digest}" \
            --out "$RUNNER_TEMP/acd-server-tools.json"
      - name: Open digest lock update PR
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_TAG: ${{ env.SERVER_TAG }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server:$SERVER_TAG" | tr -d '"')
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          uv run python scripts/update_image_digest_lock.py \
            --lock docker/image-digests.json \
            --entry acd_server \
            --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/acd-server" \
            --digest "$digest" \
            --tag "$SERVER_TAG" \
            --published-at "$published_at" \
            --workflow-run "$workflow_run" \
            --tools-json "$RUNNER_TEMP/acd-server-tools.json"
          if git diff --quiet -- docker/image-digests.json; then
            exit 0
          fi
          branch="bot/update-image-digest-acd-server-${digest#sha256:}"
          branch="${branch:0:70}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json
          git commit -m "acd-server image digest lockを更新"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "acd-server image digest lockを更新" \
            --body "Publish workflowで観測したacd-server image digestをlockへ記録しました。"
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash --auto "$branch" \
            || echo "auto-merge unavailable; merge the lock PR manually" >> "$GITHUB_STEP_SUMMARY"
