<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 15" width="26mm" height="15mm" role="img" aria-label="VibeBB silkscreen logo">
  <!--
    Single-color silkscreen artwork for PCB silkscreen layers.
    Geometry only (no text elements, no gradients) so the outline is
    font-independent when imported into KiCad.
    Units are millimeters: viewBox 26x15 = 26mm x 15mm at 1:1 scale.
    Stroke width 0.6mm and dot diameter 0.7mm stay above the typical
    0.15mm silkscreen minimum feature size of low-cost fabs.
    The board-colored rectangle below is preview only: import the
    "silkscreen" group and drop the "board-preview" group.
  -->
  <g id="board-preview">
    <rect x="0" y="0" width="26" height="15" rx="1.5" fill="#0a5e3b"/>
  </g>

  <g id="silkscreen" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- V -->
    <path d="M3 3.5 L4.5 8.5 L6 3.5"/>
    <!-- i -->
    <path d="M7 5.3 V8.5"/>
    <!-- b -->
    <path d="M8.6 3.2 V8.5"/>
    <path d="M8.6 5.6 C10.8 5.2 10.8 8.9 8.6 8.5"/>
    <!-- e -->
    <path d="M13.8 7.6 C13.2 8.9 11.4 8.7 11.4 6.9 C11.4 5.2 13.8 5.2 13.8 6.9 H11.4"/>
    <!-- B -->
    <path d="M15.2 3.5 V8.5"/>
    <path d="M15.2 3.5 H16.6 C18.2 3.5 18.2 6 16.6 6 H15.2"/>
    <path d="M15.2 6 H16.9 C18.6 6 18.6 8.5 16.9 8.5 H15.2"/>
    <!-- B -->
    <path d="M19.8 3.5 V8.5"/>
    <path d="M19.8 3.5 H21.2 C22.8 3.5 22.8 6 21.2 6 H19.8"/>
    <path d="M19.8 6 H21.5 C23.2 6 23.2 8.5 21.5 8.5 H19.8"/>
    <!-- breadboard motif: two pad rows split by a center channel -->
    <g fill="#ffffff" stroke="none">
      <circle cx="3" cy="11" r="0.35"/>
      <circle cx="5.6" cy="11" r="0.35"/>
      <circle cx="8.2" cy="11" r="0.35"/>
      <circle cx="10.8" cy="11" r="0.35"/>
      <circle cx="13.4" cy="11" r="0.35"/>
      <circle cx="16" cy="11" r="0.35"/>
      <circle cx="18.6" cy="11" r="0.35"/>
      <circle cx="21.2" cy="11" r="0.35"/>
      <circle cx="3" cy="13.4" r="0.35"/>
      <circle cx="5.6" cy="13.4" r="0.35"/>
      <circle cx="8.2" cy="13.4" r="0.35"/>
      <circle cx="10.8" cy="13.4" r="0.35"/>
      <circle cx="13.4" cy="13.4" r="0.35"/>
      <circle cx="16" cy="13.4" r="0.35"/>
      <circle cx="18.6" cy="13.4" r="0.35"/>
      <circle cx="21.2" cy="13.4" r="0.35"/>
    </g>
    <path d="M3 12.2 H21.2"/>
  </g>
</svg>
