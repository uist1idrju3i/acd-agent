[project]
name = "acd-schema"
version = "0.0.1"
description = "Pydantic models for the canonical ACD JSON Schema contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_schema"]
