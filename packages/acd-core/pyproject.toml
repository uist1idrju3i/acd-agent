[project]
name = "acd-core"
version = "0.0.1"
description = "Design graph, CAD normalization, and manufacturing extraction"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_core"]
