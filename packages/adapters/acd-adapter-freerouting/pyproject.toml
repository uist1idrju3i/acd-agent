[project]
name = "acd-adapter-freerouting"
version = "0.0.1"
description = "Freerouting adapter: Specctra DSN export, external routing, SES import"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
    "acd-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_adapter_freerouting"]
