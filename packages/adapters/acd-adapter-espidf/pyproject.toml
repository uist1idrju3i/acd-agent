[project]
name = "acd-adapter-espidf"
version = "0.0.1"
description = "ESP-IDF adapter: firmware projection, build, pin gate, QEMU virtual run"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
    "acd-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_adapter_espidf"]
