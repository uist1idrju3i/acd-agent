[project]
name = "acd-adapter-kicad"
version = "0.0.1"
description = "KiCad adapter: schematic/board projection, kicad-cli ERC/DRC/Gerber/drill"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
    "acd-core",
    "sexpdata>=1.0.2",
    "gerbonara>=1.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_adapter_kicad"]
