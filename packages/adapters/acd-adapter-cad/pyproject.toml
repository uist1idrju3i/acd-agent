[project]
name = "acd-adapter-cad"
version = "0.0.1"
description = "CAD adapter: mechanical enclosure projection"
requires-python = ">=3.12"
dependencies = [
    "acd-core",
    "acd-schema",
    "build123d==0.11.1",
    "cadquery-ocp==7.9.3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_adapter_cad"]
