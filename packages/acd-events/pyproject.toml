[project]
name = "acd-events"
version = "0.0.1"
description = "Minimal ACD event payloads carried on the OpenHands SDK EventLog"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
    "openhands-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_events"]
