[project]
name = "acd-runtime"
version = "0.0.1"
description = "Fail-closed mechanical gates for enclosure geometry"
requires-python = ">=3.12"
dependencies = [
    "acd-core",
    "build123d==0.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_runtime"]
