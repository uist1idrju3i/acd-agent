[project]
name = "acd-pipeline"
version = "0.0.1"
description = "Golden design pipeline orchestration"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
    "acd-core",
    "acd-adapter-kicad",
    "acd-adapter-freerouting",
    "acd-adapter-cad",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_pipeline"]
