[project]
name = "acd-tools"
version = "0.0.1"
description = "External tool capability probes (kicad-cli, freerouting, CAD kernel)"
requires-python = ">=3.12"
dependencies = [
    "acd-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_tools"]
