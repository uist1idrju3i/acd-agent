[project]
name = "acd-tools"
version = "0.0.1"
description = "External tool capability probes (kicad-cli, freerouting, CAD kernel)"
requires-python = ">=3.12"
dependencies = [
    "acd-core",
    "acd-schema",
    "acd-pipeline",
    "fastmcp>=3.0.0",
    "build123d==0.11.1",
    "cadquery-ocp==7.9.3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
acd-mcp = "acd_tools.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acd_tools"]
