[project]
name = "acd-agent"
version = "0.0.1"
description = "ACD workspace root (AI-first CAD on OpenHands Software Agent SDK)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*"]
exclude = ["packages/adapters"]

[tool.uv.sources]
acd-schema = { workspace = true }
acd-core = { workspace = true }
acd-tools = { workspace = true }
acd-adapter-kicad = { workspace = true }
acd-adapter-freerouting = { workspace = true }
acd-adapter-cad = { workspace = true }
acd-pipeline = { workspace = true }
openhands-sdk = { path = "vendor/software-agent-sdk/openhands-sdk" }
openhands-workspace = { path = "vendor/software-agent-sdk/openhands-workspace" }

[dependency-groups]
dev = [
    "acd-schema",
    "acd-core",
    "acd-tools",
    "acd-adapter-kicad",
    "acd-adapter-freerouting",
    "acd-adapter-cad",
    "acd-pipeline",
    "openhands-sdk",
    "openhands-workspace",
    "build123d==0.11.1",
    "cadquery-ocp==7.9.3.1.1",
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/adapters/*/src", "plugins/acd/skills/*/scripts", "plugins/acd/hooks/scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "scripts", "fixtures", "plugins"]
exclude = ["**/__pycache__", "vendor", "**/.venv"]
executionEnvironments = [
    { root = "packages/acd-schema/src" },
    { root = "packages/acd-core/src" },
    { root = "packages/acd-tools/src", extraPaths = [
        "vendor/software-agent-sdk/openhands-sdk",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = "packages/adapters/acd-adapter-kicad/src" },
    { root = "packages/adapters/acd-adapter-freerouting/src" },
    { root = "packages/adapters/acd-adapter-cad/src" },
    { root = "packages/acd-pipeline/src" },
    { root = "plugins/acd/skills/acd-firmware-esp32c3", extraPaths = [
        "plugins/acd/skills/acd-firmware-esp32c3/scripts",
    ] },
    { root = "plugins/acd/skills/acd-cad-determinism-probe", extraPaths = [
        "plugins/acd/skills/acd-cad-determinism-probe/scripts",
    ] },
    { root = "plugins/acd/skills/acd-qc-seven-tools", extraPaths = [
        "plugins/acd/skills/acd-qc-seven-tools/scripts",
    ] },
    { root = "plugins/acd/skills/acd-reliability-review", extraPaths = [
        "plugins/acd/skills/acd-reliability-review/scripts",
    ] },
    { root = "plugins/acd/skills/acd-placement-search", extraPaths = [
        "plugins/acd/skills/acd-placement-search/scripts",
    ] },
    { root = "plugins/acd/skills/acd-silkscreen-placement", extraPaths = [
        "plugins/acd/skills/acd-silkscreen-placement/scripts",
    ] },
    { root = "scripts", extraPaths = [
        ".",
        "packages/acd-pipeline/src",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = ".", extraPaths = [
        "scripts",
        "vendor/software-agent-sdk/openhands-sdk",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = "plugins/acd/hooks", extraPaths = [
        "plugins/acd/hooks/scripts",
    ] },
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
