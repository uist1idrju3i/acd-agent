[project]
name = "acd"
version = "0.0.2"
description = "AI-first PCB, enclosure, and firmware design framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "sexpdata>=1.0.2",
    "gerbonara>=1.6.3",
    "build123d==0.11.1",
    "cadquery-ocp==7.9.3.1.1",
    "openhands-sdk==1.49.2",
    "openhands-tools==1.49.2",
    "openhands-workspace==1.49.2",
    "cairosvg==2.9.1",
]

[project.scripts]
acd-evidence-check = "acd.openhands.evidence.check:main"
acd-design-revision = "acd.openhands.evidence.revision:main"
acd-evidence-git-check = "acd.openhands.evidence.git:main"
acd-locked-image = "acd.openhands.locked_image_cli:main"

[tool.uv]
constraint-dependencies = ["mcp<2", "protobuf<7"]

[tool.uv.sources]
openhands-sdk = { path = "vendor/software-agent-sdk/openhands-sdk", editable = true }
openhands-tools = { path = "vendor/software-agent-sdk/openhands-tools", editable = true }
openhands-workspace = { path = "vendor/software-agent-sdk/openhands-workspace", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acd"]

[tool.hatch.build.targets.wheel.force-include]
"docker/image-digests.json" = "acd/openhands/image-digests.json"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "plugins/acd/skills/*/scripts", "plugins/acd/hooks/scripts"]
# Documentation contains intentionally abbreviated Python snippets; do not format Markdown fences.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# agent-artifacts holds verbatim scripts recorded from real-machine runs; keep them unmodified.
extend-exclude = ["vendor", "examples/*/agent-artifacts"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    # Stage 1 of the pylint/bandit rollout: rules that are cheap to keep at zero.
    "PLW", "PLR0402", "PLR1714", "PLR5501",
    "S102", "S106", "S108", "S110", "S301", "S307", "S324", "S602", "S604", "S605", "S608",
]
# Complexity rules (C901, PLR0911/0912/0913/0915, PLR2004) are ratcheted by
# scripts/verify_ruff_ratchet.py against contracts/ruff-ratchet-baseline.json
# instead of being selected here; see docs/operations.md.
# S603/S607: subprocess with argument lists and PATH lookup is the documented
# Skill/CLI boundary, so those rules only produce noise here.
# S105: KiCad s-expression tokenizers and the SECRET_MASK placeholder trip the
# hardcoded-password heuristic; real secrets are covered by SecretRegistry tests.
# PLW2901: narrowing a loop variable in place (`item = _as_object(item, ...)`) is the
# local idiom for validating untyped JSON/graph entries.
ignore = ["S105", "PLW2901"]
# Japanese generated-document templates use full-width punctuation on purpose.
allowed-confusables = ["（", "）", "／", "×", "・"]

[tool.ruff.lint.per-file-ignores]
# The embedded HTML/CSS/JS viewer template uses long lines and arrows on purpose.
"src/acd/adapters/cad/assembly_viewer.py" = ["E501", "RUF001"]
# Tests deserialize their own pickles and use literal /tmp paths as opaque fixtures.
"tests/**" = ["S108", "S301"]
"plugins/acd/**/tests/**" = ["S108", "S301"]
"scripts/tests/**" = ["S108", "S301"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts", "fixtures", "plugins"]
exclude = ["**/__pycache__", "vendor", "**/.venv"]
executionEnvironments = [
    { root = "src", extraPaths = [
        "vendor/software-agent-sdk/openhands-sdk",
        "vendor/software-agent-sdk/openhands-tools",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = "plugins/acd/skills/acd-firmware-esp32c3", extraPaths = [
        "plugins/acd/skills/acd-firmware-esp32c3/scripts",
    ] },
    { root = "plugins/acd/skills/acd-cad-determinism-probe", extraPaths = [
        "plugins/acd/skills/acd-cad-determinism-probe/scripts",
    ] },
    { root = "plugins/acd/skills/acd-qc-seven-tools", extraPaths = [
        "plugins/acd/skills/acd-qc-seven-tools/scripts",
    ] },
    { root = "plugins/acd/skills/acd-reliability-review", extraPaths = [
        "plugins/acd/skills/acd-reliability-review/scripts",
    ] },
    { root = "plugins/acd/skills/acd-dfa-review", extraPaths = [
        "plugins/acd/skills/acd-dfa-review/scripts",
    ] },
    { root = "plugins/acd/skills/acd-placement-search", extraPaths = [
        "plugins/acd/skills/acd-placement-search/scripts",
    ] },
    { root = "plugins/acd/skills/acd-silkscreen-placement", extraPaths = [
        "plugins/acd/skills/acd-silkscreen-placement/scripts",
    ] },
    { root = "plugins/acd/skills/acd-product-docs", extraPaths = [
        "plugins/acd/skills/acd-product-docs/scripts",
    ] },
    { root = "plugins/acd/skills/acd-install-doctor", extraPaths = [
        "plugins/acd/skills/acd-install-doctor/scripts",
    ] },
    { root = "plugins/acd/skills/acd-theme-song", extraPaths = [
        "plugins/acd/skills/acd-theme-song/scripts",
    ] },
    { root = "plugins/acd/skills/acd-workaround", extraPaths = [
        "plugins/acd/skills/acd-workaround/scripts",
    ] },
    { root = "plugins/acd/skills/acd-design-knowledge", extraPaths = [
        "plugins/acd/skills/acd-design-knowledge/scripts",
    ] },
    { root = "scripts", extraPaths = [
        ".",
        "src",
        "plugins/acd/skills/acd-firmware-esp32c3/scripts",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = ".", extraPaths = [
        "scripts",
        "vendor/software-agent-sdk/openhands-sdk",
        "vendor/software-agent-sdk/openhands-tools",
        "vendor/software-agent-sdk/openhands-workspace",
    ] },
    { root = "plugins/acd/hooks", extraPaths = [
        "plugins/acd/hooks/scripts",
    ] },
]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
addopts = "-q -n auto --dist loadgroup"
filterwarnings = [
    "error::DeprecationWarning",
    # Pinned SDK v1.47.0 still walks the deprecated LLM.modify_params field internally.
    "ignore:Deprecated since v1.42.0 and scheduled for removal in v1.47.0:DeprecationWarning",
]
markers = [
    "pinned_footprint_library: requires the pinned KiCad footprint library; runs in the container-gates job with ACD_REQUIRE_PINNED_LIBRARY=1",
]
